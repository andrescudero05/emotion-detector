<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { margin: 0; background: #f4f6fb; color: #1d2636; }
        main { max-width: 760px; margin: 4rem auto; padding: 2rem; }
        .panel { padding: 2rem; background: #fff; border-radius: 16px;
                 box-shadow: 0 10px 35px rgb(20 35 70 / 9%); }
        h1 { margin-top: 0; }
        p { line-height: 1.5; }
        label { display: block; margin: 1.25rem 0 .5rem; font-weight: 650; }
        textarea { box-sizing: border-box; width: 100%; min-height: 150px;
                   padding: 1rem; border: 1px solid #cbd2df; border-radius: 10px;
                   font: inherit; resize: vertical; }
        button { margin-top: 1rem; padding: .8rem 1.1rem; border: 0;
                 border-radius: 9px; background: #3157c8; color: white;
                 font: inherit; font-weight: 650; cursor: pointer; }
        button:disabled { opacity: .65; cursor: wait; }
        #system_response { margin-top: 1.25rem; padding: 1rem;
                           border-radius: 10px; background: #f0f3fa;
                           overflow-wrap: anywhere; }
        .hint { color: #5d687a; font-size: .93rem; }
    </style>
</head>
<body>
<main>
    <section class="panel">
        <h1>Emotion Detector</h1>
        <p>Enter a statement in English and the Watson NLP service will estimate
           its joy, sadness, anger, fear, and disgust scores.</p>
        <form id="emotion-form">
            <label for="textToAnalyze">Text to analyze</label>
            <textarea id="textToAnalyze" name="textToAnalyze"
                      placeholder="For example: I am so happy to be here!"
                      required></textarea>
            <button id="analyze-button" type="submit">Analyze emotions</button>
        </form>
        <h2>Result</h2>
        <p id="system_response" aria-live="polite">Your result will appear here.</p>
        <p class="hint">Predictions are estimates generated by an AI model.</p>
    </section>
</main>
<script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
